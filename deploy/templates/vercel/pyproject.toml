[project]
name = "speech-emotion"
version = "1.0.0"
requires-python = "==3.13.*"
# Pinned to the exact versions every model in this project was verified under. Left free, the
# resolver picks a 2021 transformers whose tokenizers has no wheel and needs a Rust toolchain.
dependencies = [
    "fastapi==0.141.1",
    "python-multipart==0.0.32",
    "pydantic==2.13.5",
    "PyYAML==6.0.3",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "numba==0.67.0",
    "llvmlite==0.49.0",
    "soundfile==0.14.0",
    "librosa==1.0.0",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "torch==2.14.0",
    "funasr==1.4.16",
    "modelscope==1.40.1",
    "transformers==5.17.0",
    "tokenizers==0.23.2",
    "huggingface_hub==1.33.0",
    "safetensors==0.8.0",
    "sentencepiece==0.2.2",
]

# CPU-only torch: the default build pulls ~3 GB of CUDA libraries a CPU function never uses.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
