# Public deployment config. Same models and numbers as the local config.yaml; only the
# exposure differs: YouTube off, tighter limits, the page served from the API itself.

encoder:
  model_id: "iic/emotion2vec_plus_base"
  hub: "ms"
  generate_kwargs:
    granularity: "utterance"
    extract_embedding: true

classifier:
  artifact_path: "artifacts/tier1b_best_head.joblib"
  expected_config: "C: acted+MELD+IEMOCAP"

audio:
  sample_rate: 16000
  min_duration_sec: 1.0
  # 60s matches what the product asks for and caps one visitor at ~45-50s of shared CPU.
  max_duration_sec: 60.0
  silence_rms_threshold: 0.001

explainability:
  window_sec: 5.0

server:
  max_upload_mb: 15
  log_level: "info"
  frontend_path: "index.html"

youtube:
  # Off on the public site: an open downloader is an abuse magnet, ties up the one CPU, and
  # downloading video audio sits badly with YouTube's terms. Still available locally.
  enabled: false
  ffmpeg_location: null

adaptive:
  artifacts_dir: "Router"
  threshold: 0.375
